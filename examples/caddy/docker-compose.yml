services:
  frontend:
    image: ghcr.io/talodev/frontend:latest
    environment:
      - API_URL=https://${BACKEND_DOMAIN}

  backend:
    image: ghcr.io/talodev/backend:latest
    restart: on-failure:3
    volumes:
      - .env:/usr/backend/.env
    depends_on:
      - db
      - redis

  db:
    image: mysql:8.4
    environment:
      - MYSQL_DATABASE=${DB_NAME}
      - MYSQL_USER=${DB_USER}
      - MYSQL_PASSWORD=${DB_PASS}
      # A random root password is generated and printed once on first start
      # (`docker compose logs db`). Only that account can create users, so the
      # app deliberately connects as ${DB_USER} instead.
      - MYSQL_RANDOM_ROOT_PASSWORD=1
    restart: always
    volumes:
      - db-data:/var/lib/mysql
    
  redis:
    image: redis:8-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:24.12-alpine
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB}
    restart: always
    ports:
      # Loopback so the port isn't exposed.
      - 127.0.0.1:${CLICKHOUSE_PORT}:8123
    volumes:
      - clickhouse-data:/var/lib/clickhouse

  web:
    image: caddy:2.8-alpine
    restart: unless-stopped
    environment:
      - FRONTEND_DOMAIN=${FRONTEND_DOMAIN}
      - BACKEND_DOMAIN=${BACKEND_DOMAIN}
    ports:
      - 80:80
      - 443:443
    volumes:
      - caddy-data:/data
      - caddy-config:/config
      - ./config/Caddyfile:/etc/caddy/Caddyfile
    depends_on:
      - frontend
      - backend

volumes:
  db-data:
  clickhouse-data:
  caddy-data:
  caddy-config:
